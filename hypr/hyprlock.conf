background {
  monitor =
  path = ~/.cache/current_wallpaper
  blur_passes = 4
  blur_size = 10
  brightness = 0.5
  contrast = 0.9
}

input-field {
  monitor =
  size = 300, 50
  outline_thickness = 2
  dots_size = 0.3
  dots_spacing = 0.2
  outer_color = rgba(215, 153, 33, 0.8)
  inner_color = rgba(40, 40, 40, 0.8)
  font_color = rgb(235, 219, 178)
  fade_on_empty = true
  placeholder_text = <i>Password...</i>
  check_color = rgba(184, 187, 38, 0.8)
  fail_color = rgba(204, 36, 29, 0.8)
  fail_text = <i>Wrong password</i>
  position = 0, -100
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:1000] echo "$TIME"
  color = rgba(235, 219, 178, 0.9)
  font_size = 64
  font_family = Iosevka Nerd Font
  position = 0, 200
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %d %B")"
  color = rgba(215, 153, 33, 0.8)
  font_size = 24
  font_family = Iosevka Nerd Font
  position = 0, 120
  halign = center
  valign = center
}
